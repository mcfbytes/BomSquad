name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      # A skipped filter step yields empty outputs, so `|| 'true'` makes a manual
      # workflow_dispatch run everything rather than silently degrading to lint-only.
      site: ${{ steps.filter.outputs.site || 'true' }}
      pipeline: ${{ steps.filter.outputs.pipeline || 'true' }}
      extract: ${{ steps.filter.outputs.extract || 'true' }}
      build: ${{ steps.filter.outputs.build || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.2
        id: filter
        # paths-filter has built-in base detection for push/pull_request only.
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - '.github/workflows/ci.yml'
            site:
              - *shared
              - 'site/**'
            pipeline:
              - *shared
              - 'pipeline/**'
              - 'schemas/**'
              - 'data/**'
            # The extract job downloads 20 MB and parses 309 MB, so it runs only when
            # something that can change its output changed: the pin, the filter policy,
            # the extractor itself, the DDL it verifies against, or the committed files.
            extract:
              - *shared
              - 'pipeline/config/mame.json'
              - 'pipeline/config/mame-extract.json'
              - 'pipeline/src/mame/**'
              - 'pipeline/src/db/**'
              - 'schemas/schema.sql'
              - 'extract/**'
            # The database build reads everything the dataset is made of, and the row
            # files T6.1 emits move whenever the curated device map does — so a chip PR
            # that maps one device changes extract/machine_chip.json and must rerun this.
            build:
              - *shared
              - 'pipeline/**'
              - 'schemas/**'
              - 'data/**'
              - 'extract/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format

  # TASKS T3.8. system16.com is reference-only by its owner's decision, not ours: its
  # robots.txt disallows this user agent outright and its origin refuses non-browser
  # clients. A curator may read a page and cite it as a `source_url` on a row they author by
  # hand; no code here may fetch it. This job is what makes that a property of the
  # repository rather than an intention, and it runs on every change — not behind a
  # paths-filter — because the rule is about the whole tree and a scraper can be added
  # anywhere in it. It reads only the working copy and takes a couple of seconds.
  #
  # The other half of the rule is `reconcile/http.ts`, which refuses the same host at run
  # time from the same `config/reconcile.json` declaration. Neither is sufficient alone: a
  # static scan cannot see a hostname assembled at run time, and a run-time check cannot see
  # a curl in a shell script.
  source-guard:
    name: Source guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: No fetch of a reference-only host
        run: npm run reconcile:guard --workspace @bomsquad/pipeline

  pipeline:
    name: Pipeline
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @bomsquad/pipeline
      - run: npm run test --workspace @bomsquad/pipeline
      - run: npm run build --workspace @bomsquad/pipeline

  # TASKS T2.5. Two claims are checked here, and neither can be checked by the unit tests:
  #
  #   1. Determinism end to end — the extraction is run twice against the real 309 MB
  #      listxml and the two outputs are compared byte for byte.
  #   2. The committed extract is the extract — `git diff --exit-code` proves that what is
  #      in the repository is what this code, this pin and this policy produce. That also
  #      makes hand-editing `extract/` (standing rule 1) a build failure rather than a
  #      convention, and makes a MAME bump a reviewable diff.
  #
  # The golden fixtures that make an unsorted map iteration fail live in the unit tests, in
  # `pipeline/test/mame-extract.test.ts`; running twice cannot catch that on its own,
  # because insertion order does not change between two runs over one document.
  extract:
    name: Extract determinism
    needs: changes
    if: needs.changes.outputs.extract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Keyed on the pin: a new MAME release is a new key and a new download, and the old
      # entry expires on its own.
      - uses: actions/cache@v4
        with:
          path: .cache/mame
          key: mame-listxml-${{ hashFiles('pipeline/config/mame.json') }}
      - name: Fetch the pinned listxml
        run: npm run mame:fetch --workspace @bomsquad/pipeline
      - name: Extract (first run)
        run: npm run mame:extract --workspace @bomsquad/pipeline
      - name: Snapshot the first run
        run: cp -r extract "${RUNNER_TEMP}/extract-run1"
      - name: Extract (second run)
        run: npm run mame:extract --workspace @bomsquad/pipeline
      - name: Byte-compare the two runs
        run: diff -r "${RUNNER_TEMP}/extract-run1" extract
      - name: The committed extract must be the extract this code produces
        run: git diff --exit-code -- extract/

  # TASKS T6.1, T6.4, T6.5. Three claims, none of which a unit test can make:
  #
  #   1. The committed extract row files are the row files this code, this raw extract and
  #      today's curated device map produce (`git diff --exit-code`). That makes
  #      hand-editing extract/ a build failure rather than a convention, and makes a
  #      device-mapping PR reviewable as a diff of the BOM rows it actually moves.
  #   2. `pipeline validate` reaches zero errors against the whole dataset — the signal
  #      that machine_correction / machine_system reference real machine rows.
  #   3. The build is deterministic (data-quality.md §3.2 NONDETERMINISTIC_BUILD): built
  #      twice from a clean tree, dist/bomsquad.sqlite and dist/quality-report.json are
  #      byte-identical. SOURCE_DATE_EPOCH is pinned to the commit so build_date is a
  #      property of the commit rather than of when the runner happened to start, which is
  #      also what makes rebuilding an old commit reproduce its warnings exactly.
  build:
    name: Dataset build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pin build_date to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Extraction to row files (T6.1)
        run: npm run mame:rows --workspace @bomsquad/pipeline
      - name: The committed row files must be the row files this code produces
        run: git diff --exit-code -- extract/

      - name: Validate the whole dataset
        run: npm run validate --workspace @bomsquad/pipeline

      - name: Build (first run)
        run: npm run build:db --workspace @bomsquad/pipeline
      - name: Snapshot the first run
        run: |
          mkdir -p "${RUNNER_TEMP}/build1"
          cp dist/bomsquad.sqlite dist/quality-report.json "${RUNNER_TEMP}/build1/"
      - name: Build (second run)
        run: npm run build:db --workspace @bomsquad/pipeline
      - name: NONDETERMINISTIC_BUILD — byte-compare the two runs
        run: |
          cmp "${RUNNER_TEMP}/build1/bomsquad.sqlite" dist/bomsquad.sqlite
          cmp "${RUNNER_TEMP}/build1/quality-report.json" dist/quality-report.json
      - name: Quality report
        run: cat dist/quality-report.json >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @bomsquad/site
      - run: npm run test --workspace @bomsquad/site
      - run: npm run build --workspace @bomsquad/site

  ci:
    name: CI
    if: always()
    needs: [changes, lint, source-guard, pipeline, extract, build, site]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          declare -A results=(
            [changes]="${{ needs.changes.result }}"
            [lint]="${{ needs.lint.result }}"
            [source-guard]="${{ needs.source-guard.result }}"
            [pipeline]="${{ needs.pipeline.result }}"
            [extract]="${{ needs.extract.result }}"
            [build]="${{ needs.build.result }}"
            [site]="${{ needs.site.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job '$job' reported result '$result'"
              failed=1
            fi
          done
          if [[ "$failed" -eq 1 ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."
